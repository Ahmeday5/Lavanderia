<header class="topbar">

  <!-- Mobile: hamburger to open sidebar drawer -->
  <button class="t-hamburger" (click)="layout.toggleMobile()" aria-label="القائمة">
    @if (layout.mobileOpen()) {
    <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
      <path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    } @else {
    <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
      <path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    }
  </button>

  <!-- Logo / app name (mobile only — desktop shows the sidebar brand mark) -->
  <a class="logo" routerLink="/dashboard">
    <div class="logo-mark">
      <i class="fa-solid fa-water"></i>
    </div>
    <span class="logo-text">{{ appName }}</span>
  </a>

  <!-- Breadcrumb-ish page context (desktop) -->
  <div class="tbreadcrumb">
    <i class="fa-regular fa-clock"></i>
    <span>{{ today }}</span>
  </div>

  <div class="tright">
    <!-- Notification bell (visual affordance) -->
    <button class="tbell" title="الإشعارات" aria-label="الإشعارات">
      <i class="fa-regular fa-bell"></i>
      <span class="tbell__dot"></span>
    </button>

    <div class="tdivider" aria-hidden="true"></div>

    <!-- User block -->
    <div class="tuser">
      <div class="tav-wrap">
        <span class="tav" [title]="currentUser()?.name">
          {{ currentUser()?.avatar }}
        </span>
        <span class="tav__status" aria-hidden="true"></span>
      </div>
      <div class="tuser__text">
        <span class="tname">{{ currentUser()?.name }}</span>
        <span class="trole">{{ currentUser()?.role }}</span>
      </div>
    </div>

    <div class="tdivider" aria-hidden="true"></div>

    <!-- Logout -->
    <button class="tlogout" (click)="logout()" title="تسجيل الخروج">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      <span>تسجيل الخروج</span>
    </button>
  </div>

</header>
