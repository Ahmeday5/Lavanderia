<header class="topbar">

  <!-- Mobile: hamburger to open sidebar drawer -->
  <button class="t-hamburger" (click)="layout.toggleMobile()" aria-label="Menu">
    @if (layout.mobileOpen()) {
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    } @else {
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    }
  </button>

  <!-- Logo / app name -->
  <a class="logo" routerLink="/dashboard">
    <span class="logo-text">{{ appName }}</span>
  </a>

  <div class="tright">
    <!-- User avatar -->
    <span class="tav" [title]="currentUser()?.name">
      {{ currentUser()?.avatar }}
    </span>
    <span class="tname">{{ currentUser()?.name }}</span>
    <span class="trole">{{ currentUser()?.role }}</span>

    <!-- Logout -->
    <button class="btn btn-sm" (click)="logout()" title="Sign out">Sign out</button>
  </div>

</header>
