<nav class="sidebar" [class.collapsed]="layout.collapsed()" [class.open]="layout.mobileOpen()">
  <div class="sb-glow" aria-hidden="true"></div>
  <div class="sb-grid" aria-hidden="true"></div>

  <!-- Brand mark -->
  <div class="sb-brand">
    <div class="sb-brand__mark">
      <i class="fa-solid fa-water"></i>
    </div>
    <span class="sb-brand__name">Lavanderia</span>
  </div>

  <!-- Collapse toggle (desktop only) -->
  <button class="sb-toggle" (click)="layout.toggleCollapsed()"
    [title]="layout.collapsed() ? 'توسيع القائمة' : 'طي القائمة'">
    <span class="sb-toggle-icon-wrap">
      <svg class="sb-toggle-icon" [class.flipped]="layout.collapsed()" width="13" height="13" viewBox="0 0 14 14"
        fill="none">
        <path d="M5 2l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    <span class="sb-toggle-label">طي القائمة</span>
  </button>

  <!-- Nav sections -->
  <div class="sb-scroll">
    @for (section of visibleSections(); track section.label; let si = $index) {
    <div class="sb-sec">
      <span class="sb-sec__line" aria-hidden="true"></span>
      <span class="sb-sec__label">{{ section.label }}</span>
    </div>

    @for (item of section.items; track item.id; let ii = $index) {
    <a class="sbi" [routerLink]="item.route" routerLinkActive="on" [title]="layout.collapsed() ? item.label : ''"
      [style.animation-delay.ms]="(si * 3 + ii) * 40"
      (click)="layout.closeMobile()">
      <span class="sbi-icon-wrap">
        <app-icon class="sbi-icon" [name]="iconName(item)" [size]="16"></app-icon>
      </span>
      <span class="sbi-label">{{ item.label }}</span>
      <span class="sbi-dot" aria-hidden="true"></span>
    </a>
    }
    }
  </div>

  <!-- Footer -->
  <div class="sb-footer">
    <div class="sb-footer__badge">
      <i class="fa-solid fa-circle-check"></i>
      <span>النظام متصل</span>
    </div>
  </div>
</nav>
