<div class="auth-page">
  <div class="auth-card">
    <h2 class="fw-bold mb-1 auth-title">Create an account</h2>
    <p class="mb-4 auth-subtitle">Register to get started</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" formControlName="name" autocomplete="name" />
        <app-form-error [control]="form.controls.name" label="Name" />
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" autocomplete="email" />
        <app-form-error [control]="form.controls.email" label="Email" />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <app-password-input formControlName="password" autocomplete="new-password" />
        <app-form-error [control]="form.controls.password" label="Password" />
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <app-password-input formControlName="confirmPassword" autocomplete="new-password" />
        <app-form-error [control]="form.controls.confirmPassword" label="Confirm password" />
      </div>

      @if (serverError(); as msg) {
        <div class="alert alert-danger auth-alert" role="alert">
          <span>{{ msg }}</span>
        </div>
      }

      <button
        type="submit"
        class="btn btn-bl w-100 d-flex align-items-center justify-content-center gap-2"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>Creating account...</span>
        } @else {
          <span>Create account</span>
        }
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/auth/login" class="auth-link">Sign in</a>
    </p>
  </div>
</div>
