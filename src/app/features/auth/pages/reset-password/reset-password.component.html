<div class="auth-page">
  <div class="auth-card">
    <h2 class="fw-bold mb-1 auth-title">Reset password</h2>
    <p class="mb-4 auth-subtitle">Choose a new password for your account</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label">New password</label>
        <app-password-input formControlName="newPassword" autocomplete="new-password" />
        <app-form-error [control]="form.controls.newPassword" label="New password" />
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <app-password-input formControlName="confirmPassword" autocomplete="new-password" />
        <app-form-error [control]="form.controls.confirmPassword" label="Confirm password" />
      </div>

      @if (serverError(); as msg) {
        <div class="alert alert-danger auth-alert" role="alert">
          <span>{{ msg }}</span>
        </div>
      }

      <button
        type="submit"
        class="btn btn-bl w-100 d-flex align-items-center justify-content-center gap-2"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>Resetting...</span>
        } @else {
          <span>Reset password</span>
        }
      </button>
    </form>

    <p class="auth-footer">
      <a routerLink="/auth/login" class="auth-link">Back to sign in</a>
    </p>
  </div>
</div>
