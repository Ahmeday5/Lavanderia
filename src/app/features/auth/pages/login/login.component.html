<div class="auth-page">
  <div class="auth-card">
    <h2 class="fw-bold mb-1 auth-title">Sign in</h2>
    <p class="mb-4 auth-subtitle">Enter your credentials to access the dashboard</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
          [class.is-invalid]="isInvalid('email')"
        />
        <app-form-error [control]="form.controls.email" label="Email" />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <app-password-input
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <app-form-error [control]="form.controls.password" label="Password" />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a routerLink="/auth/forgot-password" class="auth-link">Forgot password?</a>
      </div>

      @if (serverError(); as msg) {
        <div class="alert alert-danger auth-alert" role="alert">
          <span>{{ msg }}</span>
        </div>
      }

      <button
        type="submit"
        class="btn btn-bl w-100 d-flex align-items-center justify-content-center gap-2"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign in</span>
        }
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/auth/register" class="auth-link">Register</a>
    </p>
  </div>
</div>
