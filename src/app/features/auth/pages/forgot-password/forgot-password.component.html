<div class="auth-page">
  <div class="auth-card">
    @if (submitted()) {
      <h2 class="fw-bold mb-1 auth-title">Check your email</h2>
      <p class="mb-4 auth-subtitle">
        If an account exists for that address, we've sent a link to reset your password.
      </p>
      <a routerLink="/auth/login" class="btn btn-bl w-100">Back to sign in</a>
    } @else {
      <h2 class="fw-bold mb-1 auth-title">Forgot password?</h2>
      <p class="mb-4 auth-subtitle">Enter your email and we'll send you a reset link</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" autocomplete="email" />
          <app-form-error [control]="form.controls.email" label="Email" />
        </div>

        @if (serverError(); as msg) {
          <div class="alert alert-danger auth-alert" role="alert">
            <span>{{ msg }}</span>
          </div>
        }

        <button
          type="submit"
          class="btn btn-bl w-100 d-flex align-items-center justify-content-center gap-2"
          [disabled]="isSubmitting()"
        >
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span>Sending...</span>
          } @else {
            <span>Send reset link</span>
          }
        </button>
      </form>

      <p class="auth-footer">
        <a routerLink="/auth/login" class="auth-link">Back to sign in</a>
      </p>
    }
  </div>
</div>
