<app-modal
  [open]="open()"
  title=""
  size="sm"
  [showHeader]="false"
  (closed)="onClose()"
>
  <div class="aum">
    <button type="button" class="aum__close" (click)="onClose()" [disabled]="isSubmitting()" aria-label="إغلاق">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="aum__icon">
      <i class="fa-solid" [class.fa-user-plus]="!isEditMode()" [class.fa-pen]="isEditMode()"></i>
    </div>
    <div class="aum__title">{{ isEditMode() ? 'تعديل المستخدم' : 'إضافة مستخدم جديد' }}</div>
    <div class="aum__subtitle">
      {{ isEditMode() ? 'عدّل بيانات المستخدم وصلاحيته' : 'أضف مستخدمًا جديدًا للتحكم في لوحة التحكم' }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="aum__form">
      @if (serverError(); as error) {
        <div class="alert alert-danger">{{ error }}</div>
      }

      <div class="aum__field">
        <label class="form-label" for="user-email">البريد الإلكتروني</label>
        <div class="aum__input-wrap">
          <i class="fa-solid fa-envelope aum__input-icon"></i>
          <input
            id="user-email"
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="example@mail.com"
            autocomplete="off"
          />
        </div>
        <app-form-error [control]="form.controls.email" label="البريد الإلكتروني" />
      </div>

      @if (!isEditMode()) {
        <div class="aum__field">
          <label class="form-label" for="user-password">كلمة المرور</label>
          <app-password-input
            formControlName="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <app-form-error [control]="form.controls.password" label="كلمة المرور" />
        </div>
      }

      <div class="aum__field">
        <label class="form-label" for="user-role">الصلاحية</label>
        <select id="user-role" class="form-select" formControlName="role">
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
        <app-form-error [control]="form.controls.role" label="الصلاحية" />
      </div>
    </form>
  </div>

  <ng-container modal-footer>
    <button type="button" class="aum-btn aum-btn--ghost" (click)="onClose()" [disabled]="isSubmitting()">
      إلغاء
    </button>
    <button type="button" class="aum-btn aum-btn--brand" (click)="onSubmit()" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      }
      {{ isEditMode() ? 'حفظ التعديلات' : 'إضافة المستخدم' }}
    </button>
  </ng-container>
</app-modal>
